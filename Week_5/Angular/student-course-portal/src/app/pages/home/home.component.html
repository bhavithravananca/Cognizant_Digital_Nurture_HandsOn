<h1>{{ portalName }}</h1>
<p>Browse courses, manage your enrollment, and track your grades — all in one place.</p>

<div class="stats">
  <div><strong>{{ coursesAvailable }}</strong><span>Courses Available</span></div>
  <div><strong>3</strong><span>Enrolled</span></div>
  <div><strong>3.8</strong><span>GPA</span></div>
</div>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<div class="search">
  <input [(ngModel)]="searchTerm" placeholder="Search courses..." />
  <p>Searching for: {{ searchTerm }}</p>
</div>
